name: daily-run

on:
  schedule:
    - cron: "30 23 * * *"       # 23:30 UTC = 05:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw element sets are cached between runs but never committed.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: elements-${{ github.run_id }}
          restore-keys: elements-

      - name: Verify registry before running
        run: python -m observatory.pipeline --verify || [ ! -s registry/chain.jsonl ]

      - name: Daily pipeline
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
          TRACSS_OMM_URL: ${{ vars.TRACSS_OMM_URL }}
        run: python -m observatory.pipeline

      - name: Tests
        run: python -m pytest -q tests

      - name: Commit results
        run: |
          git config user.name  "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add store registry docs
          git diff --cached --quiet && exit 0
          git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push

      # The whole-catalogue map file (TraCSS Open Data, CC0) changes completely every day, so it is
      # published on its own branch that is overwritten daily instead of growing main's history.
      - name: Publish map catalogue (map-data branch)
        if: hashFiles('map/catalog.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd map
          git init -q -b map-data
          git add catalog.json
          git -c user.name="observatory-bot" -c user.email="observatory-bot@users.noreply.github.com" commit -qm "Map catalogue $(date -u +%Y-%m-%d)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" map-data
